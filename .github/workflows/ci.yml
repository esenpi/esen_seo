name: CI

# Was das README behauptet, soll eine Maschine bestätigen — die
# Testzahl ist nur so viel wert wie der letzte grüne Lauf.
# Every branch, not just main. Gating on `branches: [main]` meant the
# check only ran once the work had already landed — a feature branch got
# no CI at all, which is most of what a feature branch is for.
on:
  push:
  pull_request:
  workflow_dispatch:

# Der Standard-Token kann sonst schreiben. Kein Job hier braucht mehr
# als Lesen — und ein kompromittierter Schritt soll auch nicht mehr
# bekommen.
permissions:
  contents: read

jobs:
  package:
    name: analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # pana bewertet die Formatierung — ein Verstoß kostet Punkte auf
      # pub.dev, also hier hart fehlschlagen statt dort still verlieren.
      - name: Verify formatting
        run: >-
          find lib test benchmark -name '*.dart'
          ! -name 'seo_dom_first_tabs_runtime.g.dart'
          -exec dart format --output=none --set-exit-if-changed {} +

      - name: Analyze package
        run: flutter analyze

      - name: Test
        run: flutter test

  example:
    name: example app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: example
        run: flutter pub get

      # Die Example-App wird vom Analyzer des Pakets NICHT erfasst —
      # sie braucht ihren eigenen Lauf, sonst merkt es niemand.
      - name: Analyze example
        working-directory: example
        run: flutter analyze

      # Das committete seo_theme.g.dart ist eine Funktion der
      # Flutter-Version (Material-Farbrollen und Typo-Werte wandern
      # zwischen Releases). Dieser Job fährt bewusst das neueste
      # stable, die Entwicklungsmaschine nicht — ohne Regenerierung
      # meldet der Drift-Guard die Toolchain-Lücke statt einer echten
      # Theme-Drift. Nutzer pinnen stattdessen ihre Flutter-Version
      # zwischen Dev und CI; dieses Repo will beide Welten.
      - name: Regenerate the example theme stylesheet for this toolchain
        working-directory: example
        run: flutter test test/seo_theme_css_test.dart --dart-define=esenSeoUpdate=true

      # Die Example-App auditiert sich mit dem eigenen Paket — das ist
      # der einzige Lauf, der die Audit-Engine gegen eine echte,
      # gewachsene Routentabelle stellt statt gegen Testfixtures. Lief
      # bisher nur lokal, also gar nicht.
      - name: Test example (dogfooding the audit)
        working-directory: example
        run: flutter test

      # Der Web-Build ist die einzige Prüfung, die package:web-Interop
      # und die Compile-Fähigkeit des Pfads abdeckt, den das Paket
      # eigentlich adressiert.
      - name: Build web
        working-directory: example
        run: flutter build web --release

      # Und dann durch den echten Prerenderer, damit ein Fehler in der
      # Ausgabe auffällt, bevor er auf einer Nutzerseite landet.
      - name: Prerender
        working-directory: example
        run: dart run bin/prerender.dart

      - name: Assert the prerendered page actually carries the content
        working-directory: example
        run: |
          set -euo pipefail
          for needle in 'id="esen-seo-content"' '<h1' 'rel="canonical"'; do
            grep -q "$needle" build/web/index.html \
              || { echo "::error::missing in prerendered index.html: $needle"; exit 1; }
          done
          test -s build/web/sitemap.xml
          test -s build/web/robots.txt
          echo "prerendered output looks sane"

  dom-first-runtime:
    name: generated DOM-first runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Generated JavaScript is compiler output. Pinning the producer makes a
      # byte comparison meaningful instead of treating toolchain drift as a
      # source change.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.27.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify the compiled tabs runtime is current
        run: dart run tool/build_dom_first_tabs_runtime.dart

      - name: Verify generated runtime formatting with its producer
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/src/renderer/seo_dom_first_tabs_runtime.g.dart

  server:
    name: server path without Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Kein Flutter, nur das Dart-SDK: der Server-/Core-Teil soll
      # Flutter-frei sein, und das ist die einzige Prüfung, die es
      # beweist statt behauptet. Schlägt sie fehl, hat sich ein
      # Flutter-Import in einen geteilten Pfad geschlichen.
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: stable

      # Walks the import graph from core.dart / server.dart / audit.dart
      # instead of checking a hand-written list of files. The list had
      # already fallen behind — seo_resolved_page.dart and
      # seo_resolution.dart are exported by core.dart and were never in
      # it — and a flat list cannot see a Flutter import reached
      # indirectly, through a file it does not name. The walker is
      # self-maintaining: reachable means checked.
      - name: Check the pure-Dart libraries for Flutter imports
        run: dart run tool/check_pure_dart.dart
